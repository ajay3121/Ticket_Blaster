version: '3.8'

services:
  app:
    build:
      context: ../backend          # Goes up to Ticket_Blaster/ then into backend/
      dockerfile: Dockerfile       # Make sure it's renamed from DockerFIle
    container_name: ticketblaster_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-ticketblaster_dev}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-ticket}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-ticketpass}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: ticketblaster_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ticket}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ticketpass}"
      POSTGRES_DB: "${POSTGRES_DB:-ticketblaster_dev}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ticketblaster_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data: